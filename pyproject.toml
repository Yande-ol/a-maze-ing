[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Maze generation and solving engine for 42"
readme = "README.md"
authors = [{name = "Yan Oliveira"}]
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools]
packages = ["mazegen"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]